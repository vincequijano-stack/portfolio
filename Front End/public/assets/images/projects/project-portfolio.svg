<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" style="background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="igRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="50%" stop-color="#FF0069"/>
      <stop offset="100%" stop-color="#7638FA"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="#FAFAFA"/>

  <!-- Left Simulated Sidebar -->
  <rect x="0" y="0" width="160" height="800" fill="#FFFFFF" stroke="#DBDBDB" stroke-width="1"/>
  <text x="30" y="55" fill="#262626" font-size="22" font-style="italic" font-weight="900" font-family="'Brush Script MT', cursive, sans-serif">Portfolio</text>
  
  <g transform="translate(25, 90)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#igRing)" stroke-width="2.5"/>
    <circle cx="20" cy="20" r="14" fill="#1E293B"/>
    <text x="48" y="16" fill="#262626" font-size="11" font-weight="700">@vincequijano</text>
    <text x="48" y="30" fill="#8E8E8E" font-size="9">CS Student</text>
  </g>

  <g transform="translate(25, 170)">
    <rect x="0" y="0" width="110" height="24" rx="6" fill="#F3F4F6"/>
    <text x="12" y="16" fill="#262626" font-size="11" font-weight="600">🏠 Feed</text>
    <text x="12" y="46" fill="#8E8E8E" font-size="11">🔍 Discover</text>
    <text x="12" y="76" fill="#8E8E8E" font-size="11">❤️ Likes</text>
    <text x="12" y="106" fill="#8E8E8E" font-size="11">✉️ Messages</text>
    <text x="12" y="136" fill="#8E8E8E" font-size="11">📊 Statistics</text>
  </g>

  <!-- Top Search Bar -->
  <rect x="160" y="0" width="640" height="60" fill="#FFFFFF" stroke="#DBDBDB" stroke-width="1"/>
  <rect x="220" y="15" width="340" height="30" rx="8" fill="#EFEFEF"/>
  <text x="245" y="35" fill="#8E8E8E" font-size="12">🔍 Search projects...</text>

  <!-- Profile Area -->
  <g transform="translate(220, 90)">
    <!-- Avatar with ring -->
    <circle cx="65" cy="65" r="58" fill="none" stroke="url(#igRing)" stroke-width="4"/>
    <circle cx="65" cy="65" r="50" fill="#0F172A"/>
    <circle cx="65" cy="55" r="20" fill="#38BDF8"/>
    <path d="M 40 100 Q 65 75 90 100" fill="#38BDF8"/>

    <!-- Info -->
    <g transform="translate(160, 20)">
      <text x="0" y="24" fill="#262626" font-size="22" font-weight="600">vincequijano</text>
      <circle cx="155" cy="18" r="8" fill="#0095F6"/>
      <path d="M 151 18 L 154 21 L 159 15" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
      
      <rect x="180" y="8" width="90" height="26" rx="6" fill="#0095F6"/>
      <text x="195" y="25" fill="#FFFFFF" font-size="11" font-weight="600">Message</text>

      <g transform="translate(0, 55)">
        <text x="0" y="0" fill="#262626" font-size="13"><tspan font-weight="bold">9</tspan> posts</text>
        <text x="80" y="0" fill="#262626" font-size="13"><tspan font-weight="bold">1.4k</tspan> followers</text>
        <text x="180" y="0" fill="#262626" font-size="13"><tspan font-weight="bold">320</tspan> following</text>
      </g>

      <g transform="translate(0, 85)">
        <text x="0" y="0" fill="#262626" font-size="13" font-weight="600">Vince Quijano · Software Engineer</text>
        <text x="0" y="18" fill="#737373" font-size="12">Crafting responsive interfaces &amp; scalable web applications.</text>
        <text x="0" y="34" fill="#00376B" font-size="12" font-weight="600">vincequijano.dev</text>
      </g>
    </g>
  </g>

  <!-- Story Highlights -->
  <g transform="translate(220, 270)">
    <g transform="translate(0, 0)">
      <circle cx="30" cy="30" r="26" fill="none" stroke="#DBDBDB" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="22" fill="#F3F4F6"/>
      <text x="30" y="35" font-size="16" text-anchor="middle">💻</text>
      <text x="30" y="70" fill="#262626" font-size="11" text-anchor="middle">Projects</text>
    </g>
    <g transform="translate(85, 0)">
      <circle cx="30" cy="30" r="26" fill="none" stroke="#DBDBDB" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="22" fill="#F3F4F6"/>
      <text x="30" y="35" font-size="16" text-anchor="middle">⚡</text>
      <text x="30" y="70" fill="#262626" font-size="11" text-anchor="middle">Skills</text>
    </g>
    <g transform="translate(170, 0)">
      <circle cx="30" cy="30" r="26" fill="none" stroke="#DBDBDB" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="22" fill="#F3F4F6"/>
      <text x="30" y="35" font-size="16" text-anchor="middle">📜</text>
      <text x="30" y="70" fill="#262626" font-size="11" text-anchor="middle">Certs</text>
    </g>
    <g transform="translate(255, 0)">
      <circle cx="30" cy="30" r="26" fill="none" stroke="#DBDBDB" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="22" fill="#F3F4F6"/>
      <text x="30" y="35" font-size="16" text-anchor="middle">🚀</text>
      <text x="30" y="70" fill="#262626" font-size="11" text-anchor="middle">About</text>
    </g>
  </g>

  <!-- Gallery Tabs -->
  <line x1="160" y1="365" x2="800" y2="365" stroke="#EFEFEF" stroke-width="1"/>
  <g transform="translate(380, 365)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#262626" stroke-width="1.5"/>
    <text x="50" y="24" fill="#262626" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">PUBLICATIONS</text>
  </g>

  <!-- Square Grid Preview -->
  <g transform="translate(200, 410)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="175" height="175" fill="#3B82F6" rx="4"/>
    <text x="87" y="95" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Analytics Dashboard</text>
    
    <rect x="195" y="0" width="175" height="175" fill="#10B981" rx="4"/>
    <text x="282" y="95" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">E-Commerce Web</text>

    <rect x="390" y="0" width="175" height="175" fill="#8B5CF6" rx="4"/>
    <text x="477" y="95" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Aura Fitness App</text>

    <!-- Row 2 -->
    <rect x="0" y="195" width="175" height="175" fill="#F59E0B" rx="4"/>
    <text x="87" y="290" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Developer API Portal</text>

    <rect x="195" y="195" width="175" height="175" fill="#06B6D4" rx="4"/>
    <text x="282" y="290" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Astra AI Engine</text>

    <rect x="390" y="195" width="175" height="175" fill="#EC4899" rx="4"/>
    <text x="477" y="290" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Rule Mining Lab</text>
  </g>
</svg>
