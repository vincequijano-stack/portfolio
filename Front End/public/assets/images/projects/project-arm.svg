<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" style="background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgG)"/>
  
  <!-- Top App Bar -->
  <rect x="0" y="0" width="800" height="60" fill="#1E293B" opacity="0.6"/>
  <circle cx="35" cy="30" r="6" fill="#EF4444"/>
  <circle cx="55" cy="30" r="6" fill="#F59E0B"/>
  <circle cx="75" cy="30" r="6" fill="#10B981"/>
  <text x="110" y="36" fill="#94A3B8" font-size="14" font-weight="600">MiningLab · Association Rule Mining Engine (Apriori &amp; FP-Growth)</text>
  <rect x="660" y="16" width="105" height="28" rx="6" fill="#6366F1"/>
  <text x="682" y="34" fill="#FFFFFF" font-size="12" font-weight="600">Run Mining</text>

  <!-- Metric Badges -->
  <g transform="translate(40, 85)">
    <rect width="165" height="80" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#94A3B8" font-size="12">Support Threshold</text>
    <text x="20" y="60" fill="#38BDF8" font-size="24" font-weight="bold">s ≥ 0.25</text>
  </g>
  <g transform="translate(225, 85)">
    <rect width="165" height="80" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#94A3B8" font-size="12">Confidence Min</text>
    <text x="20" y="60" fill="#818CF8" font-size="24" font-weight="bold">c ≥ 0.70</text>
  </g>
  <g transform="translate(410, 85)">
    <rect width="165" height="80" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#94A3B8" font-size="12">Max Lift Value</text>
    <text x="20" y="60" fill="#C084FC" font-size="24" font-weight="bold">3.42x</text>
  </g>
  <g transform="translate(595, 85)">
    <rect width="165" height="80" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#94A3B8" font-size="12">Total Transactions</text>
    <text x="20" y="60" fill="#34D399" font-size="24" font-weight="bold">124,500</text>
  </g>

  <!-- Central Graph: Rule Network Visualization -->
  <rect x="40" y="190" width="460" height="350" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="65" y="225" fill="#F8FAFC" font-size="15" font-weight="bold">Itemset Association Network</text>
  <text x="65" y="245" fill="#64748B" font-size="12">Node size = Support | Edge thickness = Confidence</text>

  <!-- Edges -->
  <line x1="160" y1="360" x2="270" y2="290" stroke="#6366F1" stroke-width="3" opacity="0.7"/>
  <line x1="270" y1="290" x2="380" y2="350" stroke="#A855F7" stroke-width="4" opacity="0.8"/>
  <line x1="270" y1="290" x2="260" y2="440" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
  <line x1="160" y1="360" x2="260" y2="440" stroke="#818CF8" stroke-width="2" opacity="0.5"/>
  <line x1="380" y1="350" x2="260" y2="440" stroke="#06B6D4" stroke-width="3" opacity="0.7"/>
  <line x1="380" y1="350" x2="430" y2="280" stroke="#EC4899" stroke-width="2" opacity="0.6"/>

  <!-- Nodes -->
  <circle cx="160" cy="360" r="32" fill="#312E81" stroke="#6366F1" stroke-width="3" filter="url(#glow)"/>
  <text x="160" y="364" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Bread</text>

  <circle cx="270" cy="290" r="42" fill="#4C1D95" stroke="#A855F7" stroke-width="3" filter="url(#glow)"/>
  <text x="270" y="294" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Butter</text>

  <circle cx="380" cy="350" r="38" fill="#1E3A8A" stroke="#38BDF8" stroke-width="3" filter="url(#glow)"/>
  <text x="380" y="354" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Milk</text>

  <circle cx="260" cy="440" r="28" fill="#064E3B" stroke="#10B981" stroke-width="2.5"/>
  <text x="260" y="444" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Eggs</text>

  <circle cx="430" cy="280" r="22" fill="#831843" stroke="#EC4899" stroke-width="2"/>
  <text x="430" y="284" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Coffee</text>

  <!-- Right Chart: Support vs Confidence Scatter/Bar -->
  <rect x="520" y="190" width="240" height="350" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="540" y="225" fill="#F8FAFC" font-size="14" font-weight="bold">Top Mined Rules</text>
  
  <!-- Rule List -->
  <g transform="translate(540, 255)">
    <text x="0" y="0" fill="#CBD5E1" font-size="11" font-weight="600">{Bread} → {Butter}</text>
    <rect x="0" y="8" width="200" height="6" rx="3" fill="#334155"/>
    <rect x="0" y="8" width="170" height="6" rx="3" fill="url(#accentG)"/>
    <text x="0" y="26" fill="#94A3B8" font-size="10">Conf: 85% · Lift: 2.4</text>
  </g>
  <g transform="translate(540, 315)">
    <text x="0" y="0" fill="#CBD5E1" font-size="11" font-weight="600">{Milk, Bread} → {Eggs}</text>
    <rect x="0" y="8" width="200" height="6" rx="3" fill="#334155"/>
    <rect x="0" y="8" width="150" height="6" rx="3" fill="url(#accentG)"/>
    <text x="0" y="26" fill="#94A3B8" font-size="10">Conf: 76% · Lift: 1.9</text>
  </g>
  <g transform="translate(540, 375)">
    <text x="0" y="0" fill="#CBD5E1" font-size="11" font-weight="600">{Coffee} → {Milk}</text>
    <rect x="0" y="8" width="200" height="6" rx="3" fill="#334155"/>
    <rect x="0" y="8" width="184" height="6" rx="3" fill="url(#cyanG)"/>
    <text x="0" y="26" fill="#94A3B8" font-size="10">Conf: 92% · Lift: 3.1</text>
  </g>
  <g transform="translate(540, 435)">
    <text x="0" y="0" fill="#CBD5E1" font-size="11" font-weight="600">{Cereal} → {Milk}</text>
    <rect x="0" y="8" width="200" height="6" rx="3" fill="#334155"/>
    <rect x="0" y="8" width="160" height="6" rx="3" fill="url(#cyanG)"/>
    <text x="0" y="26" fill="#94A3B8" font-size="10">Conf: 80% · Lift: 2.7</text>
  </g>

  <!-- Bottom Table: Frequent Itemsets -->
  <rect x="40" y="560" width="720" height="195" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="65" y="595" fill="#F8FAFC" font-size="15" font-weight="bold">Frequent Itemset Matrix &amp; Data Pipeline</text>
  <line x1="65" y1="615" x2="735" y2="615" stroke="#334155" stroke-width="1"/>
  
  <text x="65" y="640" fill="#94A3B8" font-size="12">Itemset ID</text>
  <text x="180" y="640" fill="#94A3B8" font-size="12">Items Included</text>
  <text x="420" y="640" fill="#94A3B8" font-size="12">Support Count</text>
  <text x="560" y="640" fill="#94A3B8" font-size="12">Execution Time</text>
  <text x="680" y="640" fill="#94A3B8" font-size="12">Status</text>

  <text x="65" y="675" fill="#F1F5F9" font-size="12">#ARM-091</text>
  <text x="180" y="675" fill="#38BDF8" font-size="12">{Butter, Bread, Milk}</text>
  <text x="420" y="675" fill="#F1F5F9" font-size="12">34,120 transactions</text>
  <text x="560" y="675" fill="#F1F5F9" font-size="12">14.2 ms (C++)</text>
  <rect x="675" y="660" width="55" height="20" rx="4" fill="#065F46"/>
  <text x="686" y="674" fill="#34D399" font-size="10" font-weight="600">VALID</text>

  <text x="65" y="715" fill="#F1F5F9" font-size="12">#ARM-092</text>
  <text x="180" y="715" fill="#C084FC" font-size="12">{Diapers, Beer}</text>
  <text x="420" y="715" fill="#F1F5F9" font-size="12">28,950 transactions</text>
  <text x="560" y="715" fill="#F1F5F9" font-size="12">8.6 ms (C++)</text>
  <rect x="675" y="700" width="55" height="20" rx="4" fill="#065F46"/>
  <text x="686" y="714" fill="#34D399" font-size="10" font-weight="600">VALID</text>
</svg>
