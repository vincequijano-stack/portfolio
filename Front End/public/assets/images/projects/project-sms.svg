  <rect x="525" y="635" width="215" height="95" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="540" y="662" fill="#34D399" font-size="13" font-weight="bold">CS420 · Machine Learning</text>
  <text x="540" y="682" fill="#94A3B8" font-size="11">Prof. Marcus Sterling · Room 108</text>
  <text x="540" y="705" fill="#F59E0B" font-size="11" font-weight="600">38 / 40 Enrolled (95%)</text>
